<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Buy or Rent Explorer</title>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.min.css">
	<link rel="stylesheet" href="./src/css/style.css">

	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<script type="module" src="./src/js/app.js"></script>
</head>
<body>
	<div class="view-switcher">
		<label>Switch dashboard</label>
		<select id="selector">
			<option value="buy-rent">Buy or Rent</option>
			<option value="todo">TODO</option>
		</select>
	</div>
	<div id="errorBanner"></div>
	<section id="buy-rent">
		<header>
			<h1>Buy or Rent</h1>
			<h5>Compare the financial impact of buying versus renting.</h5>
		</header>
        <main>
            <bench-parameters></bench-parameters>
            <bench-chart></bench-chart>
        </main>
	</section>
	<section id="todo" hidden>
		<header>
			WIP
		</header>
        <main>
			TODO
        </main>
	</section>
</body>
</html>
